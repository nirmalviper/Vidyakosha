server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large APK downloads
    sendfile on;
    tcp_nopush on;

    location /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"lipi-distribution-portal","version":"1.0.0"}';
    }

    location /api/v1/version.json {
        default_type application/json;
        return 200 '{"app":"Lipi","package":"com.aistudio.polyglotpdf.kxmzqp","versionName":"1.0.0","versionCode":1,"apkUrl":"/releases/lipi-v1.0.0.apk","checksumUrl":"/releases/SHA256SUMS.txt"}';
    }

    location /releases/ {
        types {
            application/vnd.android.package-archive apk;
            text/plain txt md;
        }
        add_header Content-Disposition 'attachment';
        add_header Cache-Control 'public, max-age=3600';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
