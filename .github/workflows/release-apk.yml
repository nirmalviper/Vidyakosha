name: Publish & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  publish-apk-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify or Prepare APK Release Package
        run: |
          mkdir -p releases
          if [ -f "releases/lipi-v1.0.0.apk" ]; then
            echo "Found pre-built signed APK in releases/lipi-v1.0.0.apk"
            cp releases/lipi-v1.0.0.apk releases/lipi-latest.apk
            sha256sum releases/lipi-v1.0.0.apk releases/lipi-latest.apk > releases/SHA256SUMS.txt
          elif [ -f "releases/vidyakosha-v1.0.0.apk" ]; then
            cp releases/vidyakosha-v1.0.0.apk releases/lipi-v1.0.0.apk
            cp releases/vidyakosha-v1.0.0.apk releases/lipi-latest.apk
            sha256sum releases/lipi-v1.0.0.apk releases/lipi-latest.apk > releases/SHA256SUMS.txt
          else
            echo "APK not found in releases/, check repository files."
            exit 1
          fi

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lipi-android-apk
          path: |
            releases/lipi-v1.0.0.apk
            releases/lipi-latest.apk
            releases/SHA256SUMS.txt
            releases/release-notes-v1.0.0.md

      - name: Publish to GitHub Releases Tab (v1.0.0)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag || 'v1.0.0' }}
          name: "Lipi Knowledge Commons ${{ inputs.release_tag || 'v1.0.0' }} (Android APK)"
          body_path: releases/release-notes-v1.0.0.md
          files: |
            releases/lipi-v1.0.0.apk
            releases/lipi-latest.apk
            releases/SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true
