name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release APK
        run: |
          gradle assembleDebug
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/vidyakosha-latest.apk
          sha256sum releases/vidyakosha-latest.apk > releases/SHA256SUMS.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidyakosha-apk
          path: |
            releases/vidyakosha-latest.apk
            releases/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag || 'v1.0.0' }}
          name: "VidyaKosha Knowledge Commons ${{ github.ref_name || inputs.release_tag || 'v1.0.0' }}"
          body_path: releases/release-notes-v1.0.0.md
          files: |
            releases/vidyakosha-latest.apk
            releases/vidyakosha-v1.0.0.apk
            releases/SHA256SUMS.txt
          generate_release_notes: true
