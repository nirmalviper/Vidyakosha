name: Publish & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  publish-apk-release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble or Verify Signed APK in releases/
        run: |
          mkdir -p releases
          if [ -s "releases/lipi-v1.0.0.apk" ]; then
            echo "Found pre-built signed APK at releases/lipi-v1.0.0.apk"
          elif ls releases/apk-parts/part_* >/dev/null 2>&1; then
            echo "Reconstructing signed APK from base64 parts in releases/apk-parts/..."
            cat releases/apk-parts/part_* | base64 -d > releases/lipi-v1.0.0.apk
          else
            echo "No APK or APK parts found in releases/"
            exit 1
          fi
          cp releases/lipi-v1.0.0.apk releases/lipi-latest.apk
          sha256sum releases/lipi-v1.0.0.apk releases/lipi-latest.apk > releases/SHA256SUMS.txt
          ls -lh releases/

      - name: Commit Reconstructed APK into releases/ Folder in Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f releases/lipi-v1.0.0.apk releases/lipi-latest.apk releases/SHA256SUMS.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): publish lipi-v1.0.0.apk in releases folder [skip ci]"
            git push || true
          fi

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lipi-android-apk
          path: |
            releases/lipi-v1.0.0.apk
            releases/lipi-latest.apk
            releases/SHA256SUMS.txt
            releases/release-notes-v1.0.0.md

      - name: Publish to GitHub Releases Tab (v1.0.0)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag || 'v1.0.0' }}
          name: "Lipi Knowledge Commons ${{ inputs.release_tag || 'v1.0.0' }} (Android APK)"
          body_path: releases/release-notes-v1.0.0.md
          files: |
            releases/lipi-v1.0.0.apk
            releases/lipi-latest.apk
            releases/SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true
